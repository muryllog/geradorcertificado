<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gerador de Certificado de Garantia — Guedes Relógios</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f1e6;--card:#fff;--ink:#1c1a14;--mut:#6b6556;--gold:#a28421;--line:#ddd4bc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--card:#16161a;--ink:#f0ead6;--mut:#9a9482;--gold:#d4af37;--line:#33301f}}
:root[data-theme="dark"]{--bg:#0b0b0d;--card:#16161a;--ink:#f0ead6;--mut:#9a9482;--gold:#d4af37;--line:#33301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px 16px 40px}
main{max-width:980px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px;letter-spacing:.02em}
p.sub{margin:0 0 18px;color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
input{width:100%;font:inherit;font-size:1rem;padding:12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
input:focus{outline:2px solid var(--gold);outline-offset:1px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.grid{grid-template-columns:2fr 2fr 1.3fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
button{font:inherit;font-weight:600;padding:12px 20px;border-radius:8px;border:0;background:var(--gold);color:#111;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.wrap{overflow-x:auto}
canvas{display:none}
img#prev{width:100%;height:auto;display:block;border-radius:8px;border:1px solid var(--line);-webkit-touch-callout:default;user-select:auto}
.hint{color:var(--mut);font-size:.8rem;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <h1>Certificado de Garantia</h1>
  <p class="sub">Preencha os dados e o certificado é atualizado na hora.</p>
  <div class="card">
    <div class="grid">
      <div><label for="modelo">Modelo do relógio</label><input id="modelo" value="Tommy Preto" autocomplete="off"></div>
      <div><label for="cliente">Nome do cliente</label><input id="cliente" value="" placeholder="Nome completo" autocomplete="off"></div>
      <div><label for="data">Data da compra</label><input id="data" type="date"></div>
    </div>
    <div class="row">
      <button id="baixar">Baixar certificado (PNG)</button>
      <button id="compartilhar" class="sec">Compartilhar / Salvar no celular</button>
      <button id="hoje" class="sec">Usar data de hoje</button>
      <span id="msg" class="hint"></span>
    </div>
  </div>
  <div class="card wrap"><canvas id="cv" width="2000" height="1414"></canvas>
    <img id="prev" alt="Certificado de garantia">
    <p class="hint">No celular: toque e segure na imagem e escolha “Salvar imagem”, ou use o botão Compartilhar.</p></div>
</main>

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const base=new Image();
const GOLD='#a28421',TXT='#ece6d2';
// barras douradas do modelo original: [x, y, largura, altura, campo]
const FIELDS=[
  {id:'modelo',x:153,y:571,w:911,h:35},
  {id:'cliente',x:153,y:679,w:911,h:35},
  {id:'data',x:153,y:783,w:422,h:36,fmt:true}
];
function fmtDate(v){if(!v)return'';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function draw(){
  ctx.drawImage(base,0,0);
  for(const f of FIELDS){
    ctx.fillStyle=GOLD;ctx.fillRect(f.x,f.y,f.w,f.h);
    let t=$(f.id).value.trim();if(f.fmt)t=fmtDate($(f.id).value);
    if(!t)continue;
    let size=26;
    ctx.fillStyle=TXT;ctx.textBaseline='middle';
    const max=f.w-jm(); 
    do{ctx.font=`${size}px "Courier New",Courier,monospace`;ctx.letterSpacing='3px';size--;}
    while(ctx.measureText(t).width>f.w-2*8-4&&size>10);
    ctx.fillText(t,f.x+8,f.y+f.h/2+1);
  }
  schedule();
}
function jm(){return 0}
let tm=null,url=null;
function schedule(){clearTimeout(tm);tm=setTimeout(()=>{cv.toBlob(b=>{if(!b)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('prev').src=url;},'image/png');},120);}
function hoje(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('data').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
base.onload=()=>{hoje();draw();};
base.src=IMG_SRC;
['modelo','cliente','data'].forEach(i=>$(i).addEventListener('input',draw));
$('hoje').onclick=()=>{hoje();draw();};
$('baixar').onclick=async()=>{
  const msg=$('msg');msg.textContent='';
  const nome=($('cliente').value.trim()||'cliente').replace(/[^\p{L}\p{N}]+/gu,'_');
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  let dl=null;
  try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename:`Certificado_${nome}.png`,data:blob});msg.textContent='Certificado salvo.';}
    catch(e){msg.textContent=e&&e.code==='declined'?'':'Não deu para baixar aqui. Toque e segure na imagem abaixo e escolha “Salvar imagem”.';}
  }else{
    msg.textContent='Toque e segure na imagem abaixo e escolha “Salvar imagem”.';
  }
};
$('compartilhar').onclick=async()=>{
  const msg=$('msg');msg.textContent='';
  const nome=($('cliente').value.trim()||'cliente').replace(/[^\p{L}\p{N}]+/gu,'_');
  const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
  const file=new File([blob],`Certificado_${nome}.png`,{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Certificado de Garantia'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  msg.textContent='Compartilhar não está disponível aqui. Toque e segure na imagem abaixo e escolha “Salvar imagem”.';
};
</script>
</body>
</html>
